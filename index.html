<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الموظفين والحركات المالية</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #0284c7;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Header & Controls */
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; }
        .header-title { display: flex; align-items: center; gap: 12px; }
        .header-title i { font-size: 1.8rem; color: var(--primary); }
        .sync-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .sync-badge.online { background: #dcfce7; color: #15803d; }
        .sync-badge.offline { background: #fee2e2; color: #b91c1c; }

        /* Controls Bar */
        .controls-card { background: var(--card-bg); padding: 15px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; }
        .form-group-inline { display: flex; align-items: center; gap: 10px; }
        select, input[type="text"], input[type="number"], input[type="date"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; }
        select:focus, input:focus { border-color: var(--primary); }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-info { background: var(--info); color: white; }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; }

        /* Table */
        .table-container { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        th { background: #f1f5f9; color: var(--text-muted); font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .actions-cell { display: flex; gap: 6px; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; border-radius: var(--radius); width: 100%; max-width: 500px; padding: 20px; box-shadow: var(--shadow); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .modal-body .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .close-modal { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }

        /* Toast Notifications */
        #toastContainer { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 6px; color: white; font-weight: 600; box-shadow: var(--shadow); opacity: 0; transform: translateY(20px); transition: 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <i class="fas fa-users-cog"></i>
                <h2>نظام إدارة الموظفين والحركات المالية</h2>
            </div>
            <div class="sync-badge offline" id="syncStatus">
                <i class="fas fa-sync-alt"></i> <span id="syncText">جاري الاتصال...</span>
            </div>
        </header>

        <!-- Controls -->
        <div class="controls-card">
            <div class="form-group-inline">
                <label>الشهر/السنة:</label>
                <input type="month" id="globalMonthYear" onchange="onGlobalMonthYearChange()">
            </div>
            <div class="form-group-inline">
                <label>رابط Google Script:</label>
                <input type="text" id="webAppUrl" placeholder="أدخل رابط Web App" style="width: 250px;">
                <button class="btn btn-primary btn-sm" onclick="saveApiUrl()"><i class="fas fa-save"></i> حفظ</button>
            </div>
            <button class="btn btn-primary" onclick="openAddEmpModal()"><i class="fas fa-user-plus"></i> إضافة موظف</button>
        </div>

        <!-- Main Employee Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم</th>
                        <th>الراتب الأساسي</th>
                        <th>الغيابات</th>
                        <th>السلف والخصومات</th>
                        <th>خصومات الأيتمات</th>
                        <th>المكافآت</th>
                        <th>صافي الراتب</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="empTableBody">
                    <!-- Dynamic Content -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal: Add Employee -->
    <div class="modal-overlay" id="addEmpModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إضافة موظف جديد</h3>
                <button class="close-modal" onclick="closeModal('addEmpModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="addEmpForm" onsubmit="handleAddEmp(event)">
                    <div class="form-group">
                        <label>اسم الموظف *</label>
                        <input type="text" id="newEmpName" required>
                    </div>
                    <div class="form-group">
                        <label>الراتب الأساسي (د.ع) *</label>
                        <input type="number" id="newEmpSalary" required min="0">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;"><i class="fas fa-check"></i> حفظ الموظف</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Financial Actions (السلف والمكافآت والخصومات) -->
    <div class="modal-overlay" id="financialModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="financialModalTitle">تسجيل حركة مالية</h3>
                <button class="close-modal" onclick="closeModal('financialModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="financialForm" onsubmit="handleFinancialSubmit(event)">
                    <input type="hidden" id="finEmpId">
                    <input type="hidden" id="finType">
                    <div class="form-group">
                        <label>اسم الموظف:</label>
                        <input type="text" id="finEmpName" readonly disabled style="background: #f1f5f9;">
                    </div>
                    <div class="form-group">
                        <label>المبلغ (د.ع) *</label>
                        <input type="number" id="finAmount" required min="0" step="250">
                    </div>
                    <div class="form-group">
                        <label>التاريخ *</label>
                        <input type="date" id="finDate" required>
                    </div>
                    <div class="form-group">
                        <label>ملاحظات</label>
                        <input type="text" id="finNote" placeholder="سبب الحركة...">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;"><i class="fas fa-save"></i> حفظ الحركة</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Item Action (سحب الأيتمات) -->
    <div class="modal-overlay" id="itemActionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>تسجيل سحب أيتم للموظف</h3>
                <button class="close-modal" onclick="closeModal('itemActionModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="itemActionForm" onsubmit="handleItemFormSubmit(event)">
                    <input type="hidden" id="itemEmpId">
                    <div class="form-group">
                        <label>اسم الموظف:</label>
                        <input type="text" id="itemEmpName" readonly disabled style="background: #f1f5f9;">
                    </div>
                    <div class="form-group">
                        <label>رقم أو وصف الأيتم *</label>
                        <input type="text" id="itemNumber" required placeholder="مثال: أيتم 45">
                    </div>
                    <div class="form-group">
                        <label>المبلغ (د.ع) *</label>
                        <input type="number" id="itemAmount" required min="0" step="250">
                    </div>
                    <div class="form-group">
                        <label>تاريخ السحب *</label>
                        <input type="date" id="itemDate" required>
                    </div>
                    <div class="form-group">
                        <label>ملاحظات إضافية (اختياري)</label>
                        <input type="text" id="itemNote" placeholder="اكتب أي ملاحظة هنا">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;"><i class="fas fa-save"></i> حفظ الأيتم واعتماده</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer"></div>

    <script>
        // Global State Variables
        let employees = [];
        let attendance = [];
        let financialActions = [];
        let absenceRecords = [];
        let disbursements = [];
        let itemsRecords = [];
        let monthSettings = {};
        let currentMonthKey = "";
        let GOOGLE_WEB_APP_URL = "";

        // Initialization
        window.addEventListener("DOMContentLoaded", () => {
            const today = new Date();
            const monthStr = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById("globalMonthYear").value = `${today.getFullYear()}-${monthStr}`;
            
            GOOGLE_WEB_APP_URL = localStorage.getItem("smart_sys_url") || "";
            document.getElementById("webAppUrl").value = GOOGLE_WEB_APP_URL;

            currentMonthKey = document.getElementById("globalMonthYear").value;
            loadFromGoogleSheet();
        });

        function saveApiUrl() {
            GOOGLE_WEB_APP_URL = document.getElementById("webAppUrl").value.trim();
            localStorage.setItem("smart_sys_url", GOOGLE_WEB_APP_URL);
            showToast("تم حفظ رابط جوجل شيت بنجاح", "success");
            loadFromGoogleSheet();
        }

        // 1. Fixed LocalStorage & Sheet Loading Logic
        async function loadFromGoogleSheet() {
            updateSyncIndicator(false, "جاري جلب البيانات من جوجل شيت...");
            if (!GOOGLE_WEB_APP_URL) {
                updateSyncIndicator(false, "غير متصل (ضع رابط Web App)");
                loadFromLocalStorage();
                return;
            }

            try {
                const noCacheUrl = GOOGLE_WEB_APP_URL + "?t=" + new Date().getTime();
                const response = await fetch(noCacheUrl);
                const data = await response.json();
                
                if (data.employees) employees = data.employees;
                if (data.attendance) attendance = data.attendance;
                if (data.financialActions) financialActions = data.financialActions;
                if (data.monthSettings) {
                    monthSettings = data.monthSettings;
                    if (monthSettings._absenceRecords) absenceRecords = monthSettings._absenceRecords;
                    if (monthSettings._disbursements) disbursements = monthSettings._disbursements;
                    if (monthSettings._itemsRecords) itemsRecords = monthSettings._itemsRecords; 
                }

                updateSyncIndicator(true, "متصل بجوجل شيت");
                saveToLocalStorage();
                renderEmployeesList();
            } catch (e) {
                console.error(e);
                updateSyncIndicator(false, "فشل الاتصال بجوجل شيت (بيانات محلية)");
                loadFromLocalStorage();
            }
        }

        function loadFromLocalStorage() {
            if(localStorage.getItem("smart_sys_employees")) employees = JSON.parse(localStorage.getItem("smart_sys_employees")) || [];
            if(localStorage.getItem("smart_sys_financial_actions")) financialActions = JSON.parse(localStorage.getItem("smart_sys_financial_actions")) || [];
            if(localStorage.getItem("smart_sys_month_settings")) {
                monthSettings = JSON.parse(localStorage.getItem("smart_sys_month_settings")) || {};
                if (monthSettings._absenceRecords) absenceRecords = monthSettings._absenceRecords || [];
                // Fixed logic: No double JSON.parse
                if (monthSettings._disbursements) disbursements = monthSettings._disbursements || [];
                if (monthSettings._itemsRecords) itemsRecords = monthSettings._itemsRecords || [];
            }
            renderEmployeesList();
        }

        function saveToLocalStorage() {
            localStorage.setItem("smart_sys_employees", JSON.stringify(employees));
            localStorage.setItem("smart_sys_financial_actions", JSON.stringify(financialActions));
            monthSettings._absenceRecords = absenceRecords;
            monthSettings._disbursements = disbursements;
            monthSettings._itemsRecords = itemsRecords;
            localStorage.setItem("smart_sys_month_settings", JSON.stringify(monthSettings));
        }

        // 2. Fixed Sync & Commit Logic (Removed no-cors silently failing mode)
        async function commitStorage() {
            saveToLocalStorage();
            if (!GOOGLE_WEB_APP_URL) return;

            updateSyncIndicator(false, "جاري الحفظ والمزامنة...");
            const payload = {
                employees,
                financialActions,
                monthSettings
            };

            try {
                await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify(payload)
                });
                updateSyncIndicator(true, "تم المزامنة والحفظ بنجاح");
            } catch(e) {
                console.error(e);
                updateSyncIndicator(false, "خطأ أثناء محاولة حفظ البيانات السحابية!");
            }
        }

        function updateSyncIndicator(isOnline, text) {
            const badge = document.getElementById("syncStatus");
            const textElem = document.getElementById("syncText");
            textElem.innerText = text;
            if (isOnline) {
                badge.className = "sync-badge online";
            } else {
                badge.className = "sync-badge offline";
            }
        }

        function onGlobalMonthYearChange() {
            currentMonthKey = document.getElementById("globalMonthYear").value;
            renderEmployeesList();
        }

        // Modal Handlers
        function openModal(id) { document.getElementById(id).classList.add("active"); }
        function closeModal(id) { document.getElementById(id).classList.remove("active"); }

        function openAddEmpModal() {
            document.getElementById("newEmpName").value = "";
            document.getElementById("newEmpSalary").value = "";
            openModal("addEmpModal");
        }

        function handleAddEmp(e) {
            e.preventDefault();
            const name = document.getElementById("newEmpName").value.trim();
            const salary = parseFloat(document.getElementById("newEmpSalary").value);
            if (!name || isNaN(salary)) return;

            const newEmp = { id: 'emp_' + Date.now(), name, salary };
            employees.push(newEmp);
            closeModal("addEmpModal");
            showToast("تمت إضافة الموظف بنجاح", "success");
            commitStorage();
            renderEmployeesList();
        }

        // Financial Actions Form Handlers
        function openFinancialModal(empId, empName, type) {
            document.getElementById("finEmpId").value = empId;
            document.getElementById("finEmpName").value = empName;
            document.getElementById("finType").value = type;
            document.getElementById("finAmount").value = "";
            document.getElementById("finNote").value = "";
            document.getElementById("finDate").value = new Date().toISOString().split('T')[0];
            
            const titleMap = { advance: "تسجيل سلفة", bonus: "تسجيل مكافأة", deduction: "تسجيل خصم" };
            document.getElementById("financialModalTitle").innerText = titleMap[type] || "تسجيل حركة مالية";
            openModal("financialModal");
        }

        function handleFinancialSubmit(e) {
            e.preventDefault();
            const empId = document.getElementById("finEmpId").value;
            const type = document.getElementById("finType").value;
            const amount = parseFloat(document.getElementById("finAmount").value);
            const date = document.getElementById("finDate").value;
            const note = document.getElementById("finNote").value.trim();

            financialActions.push({ id: 'fin_' + Date.now(), empId, type, amount, date, note, monthKey: currentMonthKey });
            showToast("تم تسجيل الحركة المالية", "success");
            closeModal("financialModal");
            commitStorage();
            renderEmployeesList();
        }

        // 3. Item Action Form Handlers
        function openItemModal(empId, empName) {
            document.getElementById('itemEmpId').value = empId;
            document.getElementById('itemEmpName').value = empName;
            document.getElementById('itemNumber').value = '';
            document.getElementById('itemAmount').value = '';
            document.getElementById('itemNote').value = '';
            document.getElementById('itemDate').value = new Date().toISOString().split('T')[0];
            openModal('itemActionModal');
        }

        function handleItemFormSubmit(e) {
            e.preventDefault();
            const empId = document.getElementById("itemEmpId").value;
            const itemNumber = document.getElementById("itemNumber").value.trim();
            const amount = parseFloat(document.getElementById("itemAmount").value);
            const date = document.getElementById("itemDate").value;
            const note = document.getElementById("itemNote").value.trim();

            itemsRecords.push({ id: 'item_' + Date.now(), empId, monthKey: currentMonthKey, itemNumber, amount, date, note });
            showToast("تم تسجيل حركة سحب الأيتم بنجاح", "success");
            closeModal('itemActionModal');
            commitStorage();
            renderEmployeesList();
        }

        function deleteEmployee(empId) {
            if (confirm("هل أنت تأكد من حذف هذا الموظف؟")) {
                employees = employees.filter(e => e.id !== empId);
                commitStorage();
                renderEmployeesList();
                showToast("تم حذف الموظف", "error");
            }
        }

        // Render Data Table
        function renderEmployeesList() {
            const tbody = document.getElementById("empTableBody");
            tbody.innerHTML = "";

            if (employees.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color: var(--text-muted);">لا يوجد موظفون مضافون حالياً.</td></tr>`;
                return;
            }

            employees.forEach((emp, index) => {
                // Calculation of month-specific numbers
                const empFin = financialActions.filter(f => f.empId === emp.id && f.monthKey === currentMonthKey);
                const advances = empFin.filter(f => f.type === 'advance').reduce((a, b) => a + b.amount, 0);
                const deductions = empFin.filter(f => f.type === 'deduction').reduce((a, b) => a + b.amount, 0);
                const bonuses = empFin.filter(f => f.type === 'bonus').reduce((a, b) => a + b.amount, 0);

                const empItems = itemsRecords.filter(i => i.empId === emp.id && i.monthKey === currentMonthKey);
                const totalItemsAmount = empItems.reduce((a, b) => a + b.amount, 0);

                const totalDeductions = advances + deductions;
                const netSalary = emp.salary + bonuses - totalDeductions - totalItemsAmount;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${emp.name}</strong></td>
                    <td>${emp.salary.toLocaleString()} د.ع</td>
                    <td>0 يوم</td>
                    <td><span style="color:var(--danger);">${totalDeductions.toLocaleString()} د.ع</span></td>
                    <td><span style="color:var(--info);">${totalItemsAmount.toLocaleString()} د.ع</span></td>
                    <td><span style="color:var(--success);">${bonuses.toLocaleString()} د.ع</span></td>
                    <td><strong>${netSalary.toLocaleString()} د.ع</strong></td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn btn-sm btn-success" onclick="openFinancialModal('${emp.id}', '${emp.name}', 'bonus')" title="إضافة مكافأة"><i class="fas fa-plus-circle"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="openFinancialModal('${emp.id}', '${emp.name}', 'advance')" title="تسجيل سلفة"><i class="fas fa-hand-holding-usd"></i></button>
                            <button class="btn btn-sm btn-info" onclick="openItemModal('${emp.id}', '${emp.name}')" title="تسجيل سحب أيتم"><i class="fas fa-box-open"></i></button>
                            <button class="btn btn-sm btn-warning" onclick="deleteEmployee('${emp.id}')" title="حذف الموظف"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add("show"), 10);
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
